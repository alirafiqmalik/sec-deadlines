name: Create venue PR

on:
  workflow_dispatch:
    inputs:
      submission:
        description: Signed submission envelope from Cloudflare
        required: true
      signature:
        description: HMAC of the exact envelope
        required: true

permissions: {}

jobs:
  create:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned data parser
        run: python -m pip install -r scripts/requirements-venue.txt
      - name: Run submission security tests
        run: python -m unittest discover -s tests -v
      - name: Verify signed input and create a reviewable PR
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION_SIGNING_KEY: ${{ secrets.SUBMISSION_SIGNING_KEY }}
          SUBMISSION_API_URL: ${{ vars.SUBMISSION_API_URL }}
        run: python scripts/venue_pr.py
